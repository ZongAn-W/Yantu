name: sjtu_study_planner_client
description: Flutter client for the SJTU study planner.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  dio: ^5.8.0+1
  file_picker: ^10.3.3
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  freezed_annotation: ^3.0.0
  go_router: ^16.0.0
  json_annotation: ^4.12.0
  path_provider: ^2.1.5
  path: ^1.9.1
  ffi: ^2.1.3
  win32: ^5.15.0
  web: ^1.1.1
  sembast: ^3.8.0
  sembast_web: ^2.4.0
  share_plus: ^11.0.0
  url_launcher: ^6.3.2

dev_dependencies:
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.9.5

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/NotoSansSC.ttf
    - assets/fonts/OFL.txt
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/PlannerSansSC-UI.ttf
