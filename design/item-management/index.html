<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>不白学 · 事项管理 — 界面设计示意</title>
<style>
  :root{
    --bg:#f5f7fa;
    --surface:#ffffff;
    --text:#20334a;
    --muted:#5b6b7d;
    --faint:#68788a;
    --blue:#275e91;
    --blue-deep:#214f7c;
    --green:#237354;
    --orange:#a85c14;
    --danger:#b3261e;
    --border:#dce3eb;
    --border-soft:#e9eef4;
    --focus:rgba(39,94,145,.18);
    --radius:12px;
    --shadow-menu:0 12px 32px rgba(32,51,74,.16), 0 2px 6px rgba(32,51,74,.06);
    --shadow-dialog:0 24px 64px rgba(23,35,49,.24);
    --font:"Noto Sans SC","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:var(--font);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  body.modal-open{overflow:hidden}
  [hidden]{display:none !important}
  button{font-family:inherit}
  h1,h2,p,ul{margin:0}
  ul{list-style:none;padding:0}
  .icon{
    width:18px;height:18px;flex:none;
    fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .svg-sprite{position:absolute;width:0;height:0;overflow:hidden}
  :focus-visible{outline:2px solid var(--blue);outline-offset:2px}
  .visually-hidden{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0;
  }

  /* ── App shell ─────────────────────────────────────────── */
  .app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
  .sidebar{
    position:sticky;top:0;height:100vh;width:240px;z-index:20;
    display:flex;flex-direction:column;
    background:var(--surface);border-right:1px solid var(--border);
  }
  .brand{display:flex;align-items:center;gap:10px;padding:18px 16px 14px}
  .brand-mark{
    width:34px;height:34px;border-radius:9px;flex:none;
    display:grid;place-items:center;background:var(--blue);color:#fff;
  }
  .brand-mark .icon{width:20px;height:20px}
  .brand-copy{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
  .brand-copy strong{font-size:15px;font-weight:600;line-height:1.3}
  .brand-copy span{font-size:11.5px;color:var(--muted);line-height:1.3}
  .avatar{
    width:30px;height:30px;flex:none;border:0;border-radius:50%;
    display:grid;place-items:center;background:var(--blue);color:#fff;cursor:pointer;
  }
  .avatar .icon{width:16px;height:16px}
  .nav{display:flex;flex-direction:column;gap:2px;padding:6px 8px}
  .nav-item{
    display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;
    border:0;border-radius:8px;background:transparent;color:var(--text);
    font-size:13.5px;text-align:left;cursor:pointer;
  }
  .nav-item .icon{width:18px;height:18px;color:var(--muted)}
  .nav-item:hover{background:#f4f7fa}
  .nav-item.is-active{background:rgba(39,94,145,.08);color:var(--blue);font-weight:600}
  .nav-item.is-active .icon{color:var(--blue)}
  .sidebar-bottom{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:12px}
  .goal-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:11px 12px}
  .goal-label{display:block;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .goal-title{margin:4px 0 2px;font-size:12.5px;font-weight:600;line-height:1.4}
  .goal-meta{font-size:11px;color:var(--muted);line-height:1.5}
  .sync-row{display:flex;align-items:center;gap:7px;padding:0 4px 2px;font-size:11.5px;color:var(--muted)}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
  .main{min-width:0;display:flex;flex-direction:column;min-height:100vh}
  .page{
    display:flex;flex-direction:column;flex:1;
    width:100%;max-width:1200px;margin:0 auto;padding:26px 32px 30px;
  }

  /* ── Page heading ──────────────────────────────────────── */
  .page-head{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:20px 24px;flex-wrap:wrap;
  }
  .head-copy{min-width:240px}
  .title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .title-row h1{font-size:24px;font-weight:600;line-height:1.25;letter-spacing:.01em}
  .demo-chip{
    display:inline-flex;align-items:center;height:20px;padding:0 8px;
    border:1px solid var(--border);border-radius:999px;background:rgba(255,255,255,.72);
    color:var(--muted);font-size:11px;line-height:1;white-space:nowrap;
  }
  .sub{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.5}
  .toolbar{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}

  .search{
    display:flex;align-items:center;width:224px;min-width:0;height:34px;
    padding:0 7px 0 10px;background:var(--surface);
    border:1px solid var(--border);border-radius:8px;color:var(--muted);
    transition:border-color .15s,box-shadow .15s;
  }
  .search .search-icon{width:16px;height:16px}
  .search input{
    flex:1;min-width:0;height:100%;padding:0 7px;
    border:0;outline:0;background:transparent;
    color:var(--text);font-family:inherit;font-size:13px;
  }
  .search input::placeholder{color:var(--faint)}
  .search input::-webkit-search-cancel-button{display:none}
  .search:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px var(--focus)}
  .search-clear{
    display:grid;place-items:center;width:24px;height:24px;padding:0;
    border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;
  }
  .search-clear:hover{background:#eef2f7;color:var(--text)}
  .search-clear .icon{width:13px;height:13px}

  .filter-btn{
    display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;
    border:1px solid var(--border);border-radius:8px;background:var(--surface);
    color:var(--text);font-size:13px;cursor:pointer;white-space:nowrap;
    transition:border-color .15s,background .15s;
  }
  .filter-btn:hover{border-color:#c7d3e0;background:#fbfcfe}
  .filter-btn[aria-expanded="true"]{border-color:var(--blue)}
  .filter-dot{width:7px;height:7px;border-radius:50%;flex:none}
  .filter-chevron{width:14px;height:14px;color:var(--faint)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    height:34px;padding:0 14px;border:1px solid transparent;border-radius:8px;
    font-size:13px;font-weight:600;line-height:1;cursor:pointer;white-space:nowrap;
    transition:background .15s,border-color .15s,color .15s,opacity .15s;
  }
  .btn .icon{width:15px;height:15px}
  .btn-primary{background:var(--blue);color:#fff}
  .btn-primary:hover{background:var(--blue-deep)}
  .btn-primary:disabled{background:var(--blue);opacity:.38;cursor:not-allowed}
  .btn-ghost{background:var(--surface);border-color:var(--border);color:var(--text)}
  .btn-ghost:hover{background:#f6f8fb;border-color:#c7d3e0}
  .btn-outline{background:var(--surface);border-color:#b9c9da;color:var(--blue)}
  .btn-outline:hover{background:#f2f6fa;border-color:var(--blue)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-danger:hover{background:#95201a}
  .new-mobile{display:none;height:30px;padding:0 10px;font-size:12.5px;margin-left:auto}
  .new-mobile .icon{width:14px;height:14px}

  /* ── Course board ──────────────────────────────────────── */
  .board{margin-top:22px}
  .board-columns{display:flex;align-items:flex-start;gap:18px}
  .board-col{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
  .board.is-empty{display:block}
  .course{
    min-width:0;overflow:hidden;
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:inset 3px 0 0 color-mix(in srgb,var(--course) 48%,#fff), 0 1px 2px rgba(32,51,74,.035);
  }
  .course-head{
    display:flex;align-items:center;gap:11px;
    padding:13px 16px;
    background:#f8fafc;
    border-bottom:1px solid var(--border-soft);
  }
  .course-icon{
    width:38px;height:38px;flex:none;border-radius:10px;
    display:grid;place-items:center;
    background:var(--course);color:#fff;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.16), 0 1px 2px rgba(32,51,74,.16);
  }
  .course-glyph{
    width:19px;height:19px;
    fill:none;stroke:currentColor;stroke-width:1.7;
    stroke-linecap:round;stroke-linejoin:round;
  }
  .course-id{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
  .course-name{
    min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
    font-size:15.5px;font-weight:600;line-height:1.4;letter-spacing:.01em;
  }
  .course-count{
    flex:none;font-size:11.5px;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }
  .course-add{
    display:inline-flex;align-items:center;gap:4px;flex:none;
    height:28px;padding:0 8px;border:1px solid transparent;border-radius:6px;
    background:transparent;color:var(--blue);font-size:12.5px;font-weight:500;
    cursor:pointer;transition:background .15s,border-color .15s;
  }
  .course-add .icon{width:14px;height:14px}
  .course-add:hover{background:rgba(39,94,145,.07);border-color:rgba(39,94,145,.14)}

  .items{padding:0}
  .item{
    display:flex;align-items:flex-start;gap:10px;
    padding:12px 14px 12px 18px;
    transition:background .12s;
  }
  .item + .item{border-top:1px solid var(--border-soft)}
  .item:hover{background:#f8fafc}
  .item-copy{flex:1;min-width:0;padding-top:1px}
  .item-title{
    font-size:14.5px;font-weight:600;line-height:1.5;
    color:var(--text);overflow-wrap:anywhere;
  }
  .item-more{
    display:grid;place-items:center;flex:none;
    width:30px;height:30px;margin-top:-3px;padding:0;
    border:0;border-radius:6px;background:transparent;
    color:#6d7e90;cursor:pointer;
    transition:background .12s,color .12s;
  }
  .item-more .icon{width:18px;height:18px;stroke-width:2}
  .item-more:hover,.item-more[aria-expanded="true"]{background:#eef2f7;color:var(--text)}
  .item:hover .item-more{color:var(--text)}
  .item-flash{animation:item-flash 1.8s ease-out}
  @keyframes item-flash{
    0%{background:rgba(39,94,145,.14)}
    35%{background:rgba(39,94,145,.10)}
    100%{background:transparent}
  }

  .course-empty{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
    min-height:104px;padding:18px 18px;text-align:center;
  }
  .course-empty-note{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
  .course-empty-note .icon{width:17px;height:17px;color:#8494a6}
  .course-empty-hint{font-size:11.5px;line-height:1.5;color:var(--muted)}

  .board-empty{
    display:flex;flex-direction:column;align-items:center;
    padding:44px 24px 46px;text-align:center;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  }
  .board-empty-icon{
    width:42px;height:42px;border-radius:50%;
    display:grid;place-items:center;
    background:#eef3f8;color:var(--muted);margin-bottom:12px;
  }
  .board-empty-icon .icon{width:20px;height:20px}
  .board-empty-title{font-size:14px;font-weight:600}
  .board-empty-hint{margin-top:5px;font-size:12.5px;color:var(--muted);line-height:1.6;max-width:520px}
  .board-empty-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}
  .board-empty .btn{height:32px;font-size:12.5px;padding:0 13px}
  .demo-foot{
    margin-top:20px;font-size:11px;line-height:1.6;color:var(--muted);
    font-variant-numeric:tabular-nums;
  }

  /* ── Popover ───────────────────────────────────────────── */
  #popover-layer{position:fixed;inset:0;z-index:60;pointer-events:none}
  .popover{
    position:fixed;pointer-events:auto;padding:5px;
    background:var(--surface);border:1px solid var(--border);border-radius:10px;
    box-shadow:var(--shadow-menu);
    animation:pop-in .12s ease-out;
  }
  @keyframes pop-in{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .popover-item{width:158px}
  .popover-course{width:236px;max-height:min(60vh,420px);overflow:auto}
  .menu-item{
    display:flex;align-items:center;gap:9px;width:100%;min-height:38px;
    padding:8px 10px;border:0;border-radius:7px;background:transparent;
    color:var(--text);font-size:13px;text-align:left;cursor:pointer;
  }
  .menu-item .icon{width:16px;height:16px;color:var(--muted)}
  .menu-item:hover{background:#f2f6fa}
  .menu-item:focus-visible{background:#e9f1f8;outline:2px solid var(--blue);outline-offset:-2px}
  .menu-item.danger{color:var(--danger)}
  .menu-item.danger .icon{color:var(--danger)}
  .course-option{
    display:flex;align-items:center;gap:9px;width:100%;min-height:38px;
    padding:8px 10px;border:0;border-radius:7px;background:transparent;
    color:var(--text);font-size:13px;text-align:left;cursor:pointer;
  }
  .course-option:hover{background:#f2f6fa}
  .course-option:focus-visible{background:#e9f1f8;outline:2px solid var(--blue);outline-offset:-2px}
  .course-option-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .course-option-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .course-option-count{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
  .course-option-check{width:14px;height:14px;color:var(--blue);opacity:0}
  .course-option.is-selected{background:#eef3f8}
  .course-option.is-selected .course-option-label{font-weight:600}
  .course-option.is-selected .course-option-check{opacity:1}

  /* ── Dialog ────────────────────────────────────────────── */
  .modal-layer{
    position:fixed;inset:0;z-index:80;
    display:grid;place-items:center;padding:20px;
  }
  .modal-backdrop{position:absolute;inset:0;background:rgba(23,35,49,.36);animation:fade-in .15s ease-out}
  .modal{
    position:relative;width:min(468px,100%);max-height:calc(100dvh - 40px);
    overflow:auto;background:var(--surface);border-radius:14px;
    box-shadow:var(--shadow-dialog);outline:none;
    animation:dialog-in .16s ease-out;
  }
  @keyframes fade-in{from{opacity:0}to{opacity:1}}
  @keyframes dialog-in{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  #modalContent{padding:22px 24px 20px}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
  .modal-head h2{font-size:17px;font-weight:600;line-height:1.4}
  .modal-close{
    display:grid;place-items:center;width:28px;height:28px;margin:-3px -4px 0 0;padding:0;
    border:0;border-radius:6px;background:transparent;color:var(--muted);cursor:pointer;
  }
  .modal-close:hover{background:#f0f4f8;color:var(--text)}
  .modal-close .icon{width:16px;height:16px}
  .modal-body{display:flex;flex-direction:column;gap:15px;margin-top:18px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field-label{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:12.5px;font-weight:600;color:#3d5064}
  .label-hint{font-size:11px;font-weight:400;color:var(--muted)}
  .input{
    width:100%;height:38px;padding:0 11px;
    border:1px solid var(--border);border-radius:8px;background:var(--surface);
    color:var(--text);font-family:inherit;font-size:13.5px;line-height:1.5;
    transition:border-color .15s,box-shadow .15s;
  }
  .input::placeholder{color:var(--faint)}
  .input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus)}
  .textarea{height:auto;min-height:82px;padding:9px 11px;resize:none;line-height:1.6}
  .select-wrap{position:relative;display:flex;align-items:center}
  .select-dot{position:absolute;left:12px;top:50%;width:8px;height:8px;margin-top:-4px;border-radius:50%;background:#c3ceda;pointer-events:none}
  .select{
    width:100%;height:38px;padding:0 34px 0 29px;
    border:1px solid var(--border);border-radius:8px;background:var(--surface);
    color:var(--text);font-family:inherit;font-size:13.5px;
    appearance:none;cursor:pointer;
    transition:border-color .15s,box-shadow .15s;
  }
  .select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--focus)}
  .select-chevron{position:absolute;right:11px;top:50%;width:14px;height:14px;margin-top:-7px;color:var(--faint);pointer-events:none}
  .field-note{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--blue)}
  .field-note.muted{color:var(--muted)}
  .field-note .icon{width:13px;height:13px}
  .swatches{display:flex;flex-wrap:wrap;gap:10px;padding:3px 0 1px}
  .swatch{
    width:26px;height:26px;flex:none;padding:0;border:2px solid #fff;border-radius:50%;
    background:var(--swatch);cursor:pointer;
    box-shadow:0 0 0 1px var(--border);
    transition:box-shadow .12s,transform .12s;
  }
  .swatch:hover{transform:scale(1.07)}
  .swatch[aria-checked="true"]{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--swatch)}
  .swatch:focus-visible{outline:2px solid var(--blue);outline-offset:3px}
  .modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;margin-top:22px}
  .modal-foot .btn{height:34px;min-width:66px}
  .confirm-text{font-size:14px;line-height:1.7;overflow-wrap:anywhere}
  .confirm-text strong{font-weight:600}
  .confirm-sub{margin-top:6px;font-size:12.5px;color:var(--muted);line-height:1.6}

  /* ── Toast ─────────────────────────────────────────────── */
  .toast{
    position:fixed;left:50%;bottom:30px;z-index:90;
    transform:translateX(-50%) translateY(6px);
    max-width:min(560px,calc(100vw - 40px));padding:9px 15px;
    border-radius:8px;background:#25384e;color:#fff;
    font-size:12.5px;line-height:1.5;box-shadow:0 8px 24px rgba(23,35,49,.24);
    opacity:0;transition:opacity .16s,transform .16s;
    pointer-events:none;text-align:center;overflow-wrap:anywhere;
  }
  .toast.is-visible{opacity:1;transform:translateX(-50%) translateY(0)}

  /* 桌面端事项与课程名对齐，强化“文件夹内容”层级 */
  @media (min-width:900px){
    .item{padding-left:65px}
    .item-copy{padding-top:0}
  }

  /* 平板宽度：保留侧栏但改单列，避免课程名被压到 2–3 个字 */
  @media (min-width:900px) and (max-width:1079px){
    .board{display:flex;flex-direction:column;gap:16px}
  }

  /* ── Mobile shell ──────────────────────────────────────── */
  .mobile-topbar{display:none}
  .bottom-nav{display:none}

  @media (max-width:899px){
    .app{grid-template-columns:1fr}
    .sidebar{display:none}
    .mobile-topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;
      height:48px;padding:0 16px;
      background:var(--surface);border-bottom:1px solid var(--border);
    }
    .mobile-brand{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600}
    .mini-mark{
      width:24px;height:24px;border-radius:7px;display:grid;place-items:center;
      background:var(--blue);color:#fff;
    }
    .mini-mark .icon{width:15px;height:15px}
    .mobile-actions{display:flex;align-items:center;gap:10px}
    .sync-inline{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
    .sync-inline i{width:6px;height:6px;border-radius:50%;background:var(--green);display:block}
    .avatar-sm{width:26px;height:26px}
    .avatar-sm .icon{width:14px;height:14px}

    .page{padding:16px 16px 90px;max-width:none}
    .page-head{flex-direction:column;align-items:stretch;gap:12px}
    .head-copy{min-width:0}
    .title-row{gap:8px}
    .title-row h1{font-size:22px;line-height:1.3}
    .demo-chip{height:19px;font-size:10.5px;padding:0 7px}
    .new-mobile{display:inline-flex;position:relative;height:34px;padding:0 11px;font-size:12.5px}
    .new-mobile::after{content:"";position:absolute;inset:-5px -3px}
    .sub{margin-top:4px;font-size:12.5px}

    .menu-item,.course-option{min-height:44px;padding:10px}

    .bottom-nav{

      flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;

  let toastTimer = 0;

  /* ── 小工具 ────────────────────────────────────────────── */
  const esc = (value) => String(value == null ? '' : value).replace(/[&<>"']/g, (ch) => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[ch]));

  const findCourse = (courseId) => DATA.find((course) => course.id === courseId);
  const findItem = (courseId, itemId) => {
    const course = findCourse(courseId);
    return course ? course.items.find((item) => item.id === itemId) : null;
  };
  const totalItems = () => DATA.reduce((sum, course) => sum + course.items.length, 0);

  function syncGoalMeta(){
    goalMeta.textContent = DATA.length + ' 门课程 · ' + totalItems() + ' 个事项';
  }

  function toast(message){
    toastEl.textContent = message;
    toastEl.hidden = false;
    requestAnimationFrame(() => toastEl.classList.add('is-visible'));
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toastEl.classList.remove('is-visible');
      setTimeout(() => { toastEl.hidden = true; }, 180);
    }, 2200);
  }

  /* ── 渲染课程 / 事项 ───────────────────────────────────── */
  function visibleCourses(){
    const query = state.query.trim().toLowerCase();
    const scoped = DATA.filter((course) => state.courseId === 'all' || course.id === state.courseId);
    if (!query) return scoped;
    const result = [];
    for (const course of scoped) {
      const nameHit = course.name.toLowerCase().includes(query);
      const items = nameHit
        ? course.items.slice()
        : course.items.filter((item) => item.title.toLowerCase().includes(query));
      if (items.length) result.push(Object.assign({}, course, {items}));
    }
    return result;
  }

  function itemHTML(course, item){
    return (
      '<li class="item">' +
        '<div class="item-copy">' +
          '<p class="item-title">' + esc(item.title) + '</p>' +
        '</div>' +
        '<button class="item-more" type="button" aria-haspopup="menu" aria-expanded="false" ' +
          'aria-label="「' + esc(item.title) + '」的操作" ' +
          'data-course="' + esc(course.id) + '" data-item="' + esc(item.id) + '">' +
          '<svg class="icon" aria-hidden="true"><use href="#i-more"/></svg>' +
        '</button>' +
      '</li>'
    );
  }

  function courseHTML(course){
    const original = findCourse(course.id) || course;
    const count = original.items.length;
    const shown = course.items.length;
    const searching = state.query.trim().length > 0;
    const countText = searching && shown !== count ? shown + ' / ' + count + ' 个事项' : count + ' 个事项';
    const addLabel = '在' + original.name + '下添加事项';
    return (
      '<section class="course" data-course="' + esc(original.id) + '" style="--course:' + original.color + '" aria-labelledby="course-' + esc(original.id) + '">' +
        '<header class="course-head">' +
          '<span class="course-icon" aria-hidden="true">' + (COURSE_ICONS[original.icon] || '') + '</span>' +
          '<div class="course-id">' +
            '<h2 class="course-name" id="course-' + esc(original.id) + '">' + esc(original.name) + '</h2>' +
            '<span class="course-count" title="' + (searching ? '匹配 ' + shown + ' 个，共 ' + count + ' 个事项' : '共 ' + count + ' 个事项') + '">' + countText + '</span>' +
          '</div>' +
          '<button class="course-add" type="button" aria-label="' + esc(addLabel) + '" data-add-course="' + esc(original.id) + '">' +
            '<svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>添加事项</span>' +
          '</button>' +
        '</header>' +
        (course.items.length
          ? '<ul class="items">' + course.items.map((item) => itemHTML(original, item)).join('') + '</ul>'
          : '<div class="course-empty">' +
              '<span class="course-empty-note"><svg class="icon" aria-hidden="true"><use href="#i-folder-plus"/></svg>这门课程还没有事项</span>' +
              '<span class="course-empty-hint">可使用上方「添加事项」创建第一个事项</span>' +
            '</div>'
        ) +
      '</section>'
    );
  }

  function emptyBoardHTML(query){
    const filtered = state.courseId !== 'all';
    const course = filtered ? findCourse(state.courseId) : null;
    const hint = filtered
      ? '当前筛选「' + esc(course ? course.name : '') + '」下没有匹配事项，可以换个关键词、清除搜索，或切换回全部课程。'
      : '可以换个关键词，或清除搜索查看全部课程与事项。';
    return (
      '<div class="board-empty">' +
        '<span class="board-empty-icon" aria-hidden="true"><svg class="icon"><use href="#i-search"/></svg></span>' +
        '<p class="board-empty-title">没有找到与「' + esc(query) + '」匹配的事项</p>' +
        '<p class="board-empty-hint">' + hint + '</p>' +
        '<div class="board-empty-actions">' +
          '<button class="btn btn-outline" type="button" data-clear-search>清除搜索</button>' +
          (filtered ? '<button class="btn btn-ghost" type="button" data-clear-filter>切换全部课程</button>' : '') +
        '</div>' +
      '</div>'
    );
  }

  function updateResultStatus(visible, query){
    const shown = visible.reduce((sum, course) => sum + course.items.length, 0);
    let text = '';
    if (query){
      text = shown ? '找到 ' + shown + ' 个事项' : '没有匹配事项';
    } else if (state.courseId !== 'all'){
      const course = findCourse(state.courseId);
      if (course) text = '已筛选 ' + course.name + '，共 ' + course.items.length + ' 个事项';
    }
    resultStatus.textContent = text;
  }

  // 桌面双列使用两条独立列流：左列课程 1/3/5，右列课程 2/4/6。
  // 每列只对自身高度负责，课程高度不相等时也不会在另一列留下行间空洞。
  function layoutCourses(visible){
    if (!desktopColumns.matches || visible.length <= 1){
      return visible.map(courseHTML).join('');
    }
    const left = [];
    const right = [];
    visible.forEach((course, index) => {
      (index % 2 === 0 ? left : right).push(course);
    });
    return (
      '<div class="board-columns">' +
        '<div class="board-col" data-col="left">' + left.map(courseHTML).join('') + '</div>' +
        (right.length
          ? '<div class="board-col" data-col="right">' + right.map(courseHTML).join('') + '</div>'
          : '') +
      '</div>'
    );
  }

  function renderBoard(){
    syncGoalMeta();
    const visible = visibleCourses();
    const query = state.query.trim();
    updateResultStatus(visible, query);
    if (query && visible.length === 0){
      board.classList.add('is-empty');
      board.innerHTML = emptyBoardHTML(query);
      return;
    }
    board.classList.remove('is-empty');
    board.innerHTML = layoutCourses(visible);
  }

  function focusItem(courseId, itemId){
    const button = board.querySelector(
      '.item-more[data-course="' + courseId + '"][data-item="' + itemId + '"]'
    );
    if (!button) return;
    const row = button.closest('.item');
    if (row){
      row.classList.add('item-flash');
      row.scrollIntoView({block:'nearest', behavior:'smooth'});
      setTimeout(() => row.classList.remove('item-flash'), 1900);
    }
    button.focus({preventScroll:true});
  }

  function focusCourseAdd(courseId){
    const courseEl = board.querySelector('.course[data-course="' + courseId + '"]');
    if (!courseEl) return;
    courseEl.scrollIntoView({block:'nearest', behavior:'smooth'});
    const add = courseEl.querySelector('.course-add');
    if (add) add.focus({preventScroll:true});
  }

  function syncSearchUI(){
    searchClear.hidden = searchInput.value.length === 0;
  }

  function syncFilterButton(){
    const course = findCourse(state.courseId);
    filterLabel.textContent = course ? course.name : '全部课程';
    if (course){
      filterDot.style.background = course.color;
      filterDot.hidden = false;
    } else {
      filterDot.hidden = true;
    }
  }

  /* ── 浮层 ──────────────────────────────────────────────── */
  function positionPopover(pop, anchor){
    const rect = anchor.getBoundingClientRect();
    const width = pop.offsetWidth;
    const height = pop.offsetHeight;
    let left = rect.right - width;
    left = Math.max(8, Math.min(left, window.innerWidth - width - 8));
    let top = rect.bottom + 6;
    if (top + height > window.innerHeight - 8) top = Math.max(8, rect.top - height - 6);
    pop.style.left = left + 'px';
    pop.style.top = top + 'px';
  }

  function focusMenuItems(pop){
    const items = Array.from(pop.querySelectorAll('.menu-item, .course-option'));
    if (items.length) items[0].focus({preventScroll:true});
  }

  function closePopover(options){
    if (!popState) return;
    const opts = options || {};
    const anchor = popState.anchor;
    anchor.setAttribute('aria-expanded', 'false');
    popState.pop.remove();
    popState = null;
    if (opts.restoreFocus) anchor.focus({preventScroll:true});
  }

  function openPopover(anchor, html, variant, onAction){
    closePopover();
    const pop = document.createElement('div');
    pop.className = 'popover ' + (variant || '');
    pop.innerHTML = html;
    popoverLayer.appendChild(pop);
    positionPopover(pop, anchor);
    anchor.setAttribute('aria-expanded', 'true');
    popState = {anchor, pop};

    pop.addEventListener('click', (event) => {
      const actionNode = event.target.closest('[data-menu-action]');
      const courseNode = event.target.closest('[data-course-option]');
      if (actionNode) onAction('item', actionNode.dataset.menuAction);
      else if (courseNode) onAction('course', courseNode.dataset.courseOption);
    });
    pop.addEventListener('keydown', (event) => {
      const nodes = Array.from(pop.querySelectorAll('.menu-item, .course-option'));
      const current = nodes.indexOf(document.activeElement);
      if (event.key === 'ArrowDown' || event.key === 'ArrowUp'){
        event.preventDefault();
        if (!nodes.length) return;
        const delta = event.key === 'ArrowDown' ? 1 : -1;
        const next = (current + delta + nodes.length) % nodes.length;
        nodes[next].focus({preventScroll:true});
      }
      if (event.key === 'Escape'){
        event.preventDefault();
        closePopover({restoreFocus:true});
      }
      if (event.key === 'Tab'){
        // 菜单是临时浮层：Tab 离开时关闭，并把焦点交还触发按钮后继续顺序导航
        closePopover({restoreFocus:true});
      }
    });
    focusMenuItems(pop);
    return pop;
  }

  function courseMenuHTML(){
    const total = totalItems();
    const option = (id, name, count, color) => {
      const selected = state.courseId === id;
      return (
        '<button class="course-option' + (selected ? ' is-selected' : '') + '" type="button" ' +
          'role="menuitemradio" aria-checked="' + selected + '" data-course-option="' + esc(id) + '">' +
          '<span class="course-option-dot" style="background:' + color + '"></span>' +
          '<span class="course-option-label">' + esc(name) + '</span>' +
          '<span class="course-option-count">' + count + '</span>' +
          '<svg class="icon course-option-check" aria-hidden="true"><use href="#i-check"/></svg>' +
        '</button>'
      );
    };
    let html = option('all', '全部课程', total, '#9aa8b8');
    for (const course of DATA) html += option(course.id, course.name, course.items.length, course.color);
    return '<div role="menu" aria-label="课程筛选">' + html + '</div>';
  }

  function openItemMenu(anchor, courseId, itemId){
    const item = findItem(courseId, itemId);
    if (!item) return;
    openPopover(anchor,
      '<div role="menu" aria-label="事项操作">' +
        '<button class="menu-item" type="button" role="menuitem" data-menu-action="edit">' +
          '<svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>编辑事项' +
        '</button>' +
        '<button class="menu-item danger" type="button" role="menuitem" data-menu-action="delete">' +
          '<svg class="icon" aria-hidden="true"><use href="#i-trash"/></svg>删除事项' +
        '</button>' +
      '</div>',
      'popover-item',
      (kind, action) => {
        if (kind !== 'item') return;
        closePopover();
        if (action === 'edit') openTaskDialog({mode:'edit', courseId, itemId, trigger:anchor});
        if (action === 'delete') openDeleteDialog({courseId, itemId});
      }
    );
  }

  /* ── 弹窗 ──────────────────────────────────────────────── */
  function openModal(html, trigger){
    modalContent.innerHTML = html;
    modalEl.removeAttribute('aria-describedby');
    modalLayer.hidden = false;
    document.body.classList.add('modal-open');
    modalState = {trigger: trigger || null};
    modalEl.scrollTop = 0;
    modalContent.querySelectorAll('[data-modal-cancel]').forEach((node) => {
      node.addEventListener('click', () => closeModal());
    });
  }

  function closeModal(options){
    if (!modalState) return;
    const opts = options || {};
    const trigger = modalState.trigger;
    modalLayer.hidden = true;
    modalContent.innerHTML = '';
    document.body.classList.remove('modal-open');
    modalState = null;
    if (opts.restoreFocus !== false && trigger && document.contains(trigger)){
      trigger.focus({preventScroll:true});
    }
  }

  function courseOptionsHTML(selectedId){
    return DATA.map((course) =>
      '<option value="' + esc(course.id) + '"' + (course.id === selectedId ? ' selected' : '') + '>' + esc(course.name) + '</option>'
    ).join('');
  }

  function taskDialogHTML(options){
    const editing = options.mode === 'edit';
    const course = options.courseId ? findCourse(options.courseId) : null;
    const item = options.item;
    const presetId = options.presetCourseId || '';
    const titleValue = item ? item.title : '';
    const descValue = item ? item.description : '';
    const selectValue = editing && course ? course.id : presetId;
    const placeholder = '<option value="" disabled' + (selectValue ? '' : ' selected') + '>请选择课程</option>';
    return (
      '<form id="taskForm" novalidate>' +
        '<div class="modal-head">' +
          '<h2 id="modalTitle">' + (editing ? '编辑事项' : '新建事项') + '</h2>' +
          '<button class="modal-close" type="button" data-modal-cancel aria-label="关闭">' +
            '<svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="field">' +
            '<label class="field-label" for="taskTitle">事项名称<span class="label-hint">必填</span></label>' +
            '<input class="input" id="taskTitle" name="title" type="text" maxlength="60" autocomplete="off" ' +
              'placeholder="例如：定积分与反常积分综合训练" value="' + esc(titleValue) + '">' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label" for="taskDesc">说明<span class="label-hint">选填 · 不在列表中展示</span></label>' +
            '<textarea class="input textarea" id="taskDesc" name="description" rows="3" maxlength="200" ' +
              'placeholder="学习范围、完成标准或备注…">' + esc(descValue) + '</textarea>' +
          '</div>' +
          '<div class="field">' +
            '<label class="field-label" for="taskCourse">所属课程<span class="label-hint">必填</span></label>' +
            '<div class="select-wrap">' +
              '<span class="select-dot" id="courseDot"></span>' +
              '<select class="select" id="taskCourse" name="course">' + placeholder + courseOptionsHTML(selectValue) + '</select>' +
              '<svg class="icon select-chevron" aria-hidden="true"><use href="#i-chevron-down"/></svg>' +
            '</div>' +
            (presetId && !editing
              ? '<p class="field-note"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg>已自动带入所属课程</p>'
              : '') +
          '</div>' +
        '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" type="button" data-modal-cancel>取消</button>' +
          '<button class="btn btn-primary" type="submit" disabled>保存</button>' +
        '</div>' +
      '</form>'
    );
  }

  function openTaskDialog(options){
    const opts = options || {};
    const mode = opts.mode === 'edit' ? 'edit' : 'new';
    let courseId = opts.courseId || null;
    let item = null;
    if (mode === 'edit'){
      item = findItem(opts.courseId, opts.itemId);
      if (!item) return;
    } else if (opts.presetCourseId){
      courseId = opts.presetCourseId;
    }
    openModal(taskDialogHTML({
      mode,
      courseId,
      item,
      presetCourseId: mode === 'new' ? courseId : ''
    }), opts.trigger);

    const form = modalContent.querySelector('#taskForm');
    const titleInput = form.querySelector('#taskTitle');
    const descInput = form.querySelector('#taskDesc');
    const courseSelect = form.querySelector('#taskCourse');
    const courseDot = form.querySelector('#courseDot');
    const saveBtn = form.querySelector('button[type="submit"]');

    const syncCourseDot = () => {
      const selected = findCourse(courseSelect.value);
      courseDot.style.background = selected ? selected.color : '#c3ceda';
    };
    const validate = () => {
      saveBtn.disabled = !titleInput.value.trim() || !courseSelect.value;
    };
    titleInput.addEventListener('input', validate);
    courseSelect.addEventListener('change', () => { syncCourseDot(); validate(); });
    syncCourseDot();
    validate();
    titleInput.focus({preventScroll:true});

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (saveBtn.disabled) return;
      const title = titleInput.value.trim();
      const description = descInput.value.trim();
      const targetCourse = findCourse(courseSelect.value);
      if (!targetCourse) return;

      if (mode === 'edit'){
        const sourceCourse = findCourse(courseId);
        const currentIndex = sourceCourse.items.findIndex((entry) => entry.id === opts.itemId);
        if (currentIndex < 0) { closeModal(); renderBoard(); return; }
        if (sourceCourse.id === targetCourse.id){
          const entry = sourceCourse.items[currentIndex];
          entry.title = title;
          entry.description = description;
          closeModal({restoreFocus:false});
          renderBoard();
          toast('已保存「' + title + '」');
          focusItem(targetCourse.id, entry.id);
        } else {
          const [moved] = sourceCourse.items.splice(currentIndex, 1);
          moved.title = title;
          moved.description = description;
          targetCourse.items.push(moved);
          closeModal({restoreFocus:false});
          renderBoard();
          toast('已保存「' + title + '」');
          focusItem(targetCourse.id, moved.id);
        }
      } else {
        const newItem = {id:'item-' + Date.now(), title, description};
        targetCourse.items.push(newItem);
        closeModal({restoreFocus:false});
        renderBoard();
        toast('已添加「' + title + '」');
        focusItem(targetCourse.id, newItem.id);
      }
    });
  }

  function openCourseDialog(options){
    const opts = options || {};
    let selectedColor = COURSE_COLORS[0];
    const swatches = COURSE_COLORS.map((color, index) =>
      '<button class="swatch" type="button" role="radio" aria-checked="' + (index === 0) + '" ' +
        'aria-label="课程颜色：' + COURSE_COLOR_NAMES[index] + '" data-color="' + color + '" ' +
        'style="--swatch:' + color + '"></button>'
    ).join('');
    openModal(
      '<form id="courseForm" novalidate>' +
        '<div class="modal-head">' +
          '<h2 id="modalTitle">新建课程</h2>' +
          '<button class="modal-close" type="button" data-modal-cancel aria-label="关闭">' +
            '<svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>' +
          '</button>' +
        '</div>' +
        '<div class="modal-body">' +
          '<div class="field">' +
            '<label class="field-label" for="courseName">课程名称<span class="label-hint">必填</span></label>' +
            '<input class="input" id="courseName" name="courseName" type="text" maxlength="24" autocomplete="off" ' +
              'placeholder="例如：概率论与数理统计">' +
          '</div>' +
          '<div class="field">' +
            '<span class="field-label">课程颜色<span class="label-hint">用于课程图标与左侧书脊</span></span>' +
            '<div class="swatches" role="radiogroup" aria-label="课程颜色">' + swatches + '</div>' +
          '</div>' +
          '<p class="field-note muted"><svg class="icon" aria-hidden="true"><use href="#i-folder-plus"/></svg>创建后会得到一个空课程文件夹，可继续添加事项</p>' +
        '</div>' +
        '<div class="modal-foot">' +
          '<button class="btn btn-ghost" type="button" data-modal-cancel>取消</button>' +
          '<button class="btn btn-primary" type="submit" disabled>创建课程</button>' +
        '</div>' +
      '</form>',
      opts.trigger || null
    );

    const form = modalContent.querySelector('#courseForm');
    const nameInput = form.querySelector('#courseName');
    const saveBtn = form.querySelector('button[type="submit"]');
    const swatchGroup = form.querySelector('.swatches');
    const validate = () => { saveBtn.disabled = !nameInput.value.trim(); };
    nameInput.addEventListener('input', validate);
    validate();
    nameInput.focus({preventScroll:true});

    swatchGroup.addEventListener('click', (event) => {
      const swatch = event.target.closest('.swatch');
      if (!swatch) return;
      selectedColor = swatch.dataset.color;
      swatchGroup.querySelectorAll('.swatch').forEach((node) => {
        node.setAttribute('aria-checked', node === swatch ? 'true' : 'false');
      });
    });

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      if (saveBtn.disabled) return;
      const name = nameInput.value.trim();
      const newCourse = {
        id: 'course-' + Date.now(),
        name,
        color: selectedColor,
        icon: 'book',
        items: []
      };
      DATA.push(newCourse);
      // 新课程必须可见：清除可能把它过滤掉的搜索与课程筛选
      state.query = '';
      state.courseId = 'all';
      searchInput.value = '';
      syncSearchUI();
      syncFilterButton();
      closeModal({restoreFocus:false});
      renderBoard();
      toast('已创建课程「' + name + '」');
      focusCourseAdd(newCourse.id);
    });
  }

  function openDeleteDialog(options){    const course = findCourse(options.courseId);
    const item = findItem(options.courseId, options.itemId);
    if (!course || !item) return;
    openModal(
      '<div class="modal-head">' +
        '<h2 id="modalTitle">删除事项</h2>' +
        '<button class="modal-close" type="button" data-modal-cancel aria-label="关闭">' +
          '<svg class="icon" aria-hidden="true"><use href="#i-close"/></svg>' +
        '</button>' +
      '</div>' +
      '<div class="modal-body">' +
        '<p class="confirm-text">确定要删除「<strong>' + esc(item.title) + '</strong>」吗？</p>' +
        '<p class="confirm-sub" id="deleteWarning">删除后无法恢复，请谨慎操作。</p>' +
      '</div>' +
      '<div class="modal-foot">' +
        '<button class="btn btn-ghost" type="button" data-modal-cancel>取消</button>' +
        '<button class="btn btn-danger" type="button" id="confirmDelete">确认删除</button>' +
      '</div>',
      options.trigger || null
    );
    modalEl.setAttribute('aria-describedby', 'deleteWarning');
    const cancelButton = modalContent.querySelector('.modal-foot [data-modal-cancel]');
    if (cancelButton) cancelButton.focus({preventScroll:true});
    const confirm = modalContent.querySelector('#confirmDelete');
    confirm.addEventListener('click', () => {
      const index = course.items.findIndex((entry) => entry.id === options.itemId);
      if (index >= 0) course.items.splice(index, 1);
      const next = course.items[index] || course.items[index - 1] || null;
      closeModal({restoreFocus:false});
      renderBoard();
      toast('已删除「' + item.title + '」');
      if (next) focusItem(course.id, next.id);
      else focusCourseAdd(course.id);
    });
  }

  /* ── 事件绑定 ──────────────────────────────────────────── */
  function clearSearch(){
    state.query = '';
    searchInput.value = '';
    syncSearchUI();
    renderBoard();
    searchInput.focus({preventScroll:true});
  }

  board.addEventListener('click', (event) => {
    const more = event.target.closest('.item-more');
    if (more){
      event.stopPropagation();
      if (popState && popState.anchor === more){ closePopover({restoreFocus:true}); return; }
      openItemMenu(more, more.dataset.course, more.dataset.item);
      return;
    }
    const add = event.target.closest('[data-add-course]');
    if (add){
      if (popState && popState.anchor === add){ closePopover({restoreFocus:true}); return; }
      openTaskDialog({mode:'new', presetCourseId:add.dataset.addCourse, trigger:add});
      return;
    }
    if (event.target.closest('[data-clear-search]')){ clearSearch(); return; }
    if (event.target.closest('[data-clear-filter]')){
      state.courseId = 'all';
      syncFilterButton();
      renderBoard();
      filterBtn.focus({preventScroll:true});
    }
  });

  searchInput.addEventListener('input', () => {
    state.query = searchInput.value;
    syncSearchUI();
    renderBoard();
  });
  searchInput.addEventListener('keydown', (event) => {
    if (event.key === 'Escape' && searchInput.value){ event.preventDefault(); clearSearch(); }
  });
  searchClear.addEventListener('click', clearSearch);
  searchBox.addEventListener('click', (event) => {
    if (!event.target.closest('button')) searchInput.focus();
  });

  filterBtn.addEventListener('click', () => {
    if (popState && popState.anchor === filterBtn){ closePopover({restoreFocus:true}); return; }
    openPopover(filterBtn, courseMenuHTML(), 'popover-course', (kind, id) => {
      if (kind !== 'course') return;
      state.courseId = id;
      closePopover({restoreFocus:true});
      syncFilterButton();
      renderBoard();
    });
  });

  document.querySelectorAll('[data-new-course]').forEach((button) => {
    button.addEventListener('click', () => openCourseDialog({trigger:button}));
  });

  document.addEventListener('pointerdown', (event) => {
    if (!popState) return;
    if (popState.pop.contains(event.target) || popState.anchor.contains(event.target)) return;
    closePopover();
  });

  document.addEventListener('keydown', (event) => {
    if (!modalLayer.hidden){
      if (event.key === 'Escape'){ event.preventDefault(); closeModal(); return; }
      if (event.key === 'Tab'){
        const focusables = Array.from(modalContent.querySelectorAll(
          'button:not([disabled]), input:not([disabled]), textarea:not([disabled]), select:not([disabled])'
        )).filter((node) => node.offsetParent !== null);
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (event.shiftKey && document.activeElement === first){
          event.preventDefault(); last.focus();
        } else if (!event.shiftKey && document.activeElement === last){
          event.preventDefault(); first.focus();
        }
      }
      return;
    }
    if (popState && event.key === 'Escape'){
      event.preventDefault();
      closePopover({restoreFocus:true});
    }
  });

  window.addEventListener('resize', () => closePopover());
  window.addEventListener('scroll', () => closePopover(), true);
  if (desktopColumns.addEventListener){
    desktopColumns.addEventListener('change', () => {
      closePopover();
      renderBoard();
    });
  }

  /* ── 初始化 ────────────────────────────────────────────── */
  syncSearchUI();
  syncFilterButton();
  renderBoard();
})();
</script>
</body>
</html>
